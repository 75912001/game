# 场景过渡效果配置文件
# 任何修改此文件的行为都需要通知客户端和服务端开发人员

# 过渡效果ID规则:
#   - 1: 垂直 (上下合拢/展开)
#   - 2: 水平 (左右合拢/展开)
#   - 3: 淡入淡出
# 过渡速度 (speed): 每帧进度增量，如 0.05 表示约20帧完成

transitions:
  - id: 1
    name: "垂直-标准"
    speed: 0.100

  - id: 2
    name: "水平-标准"
    speed: 0.100

  - id: 3
    name: "淡入淡出"
    speed: 0.05
