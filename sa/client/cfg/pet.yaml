# 资产ID-宠物 [4000001,4999999]
# 任何修改此文件的行为都需要通知客户端和服务端开发人员

# rarity 稀有度: 1-普通, 2-稀有, 3-史诗, 4-传说, 5-神话
# elemental 元素属性: earth-土, water-水, fire-火, wind-风 [默认:0] (整数, 范围[0,10], 总和必须等于10)
# attributes 属性
## attack - 攻击
## defense - 防御
## agility - 敏捷
## hp - 生命
## critRate - 暴击率 范围[0,1][默认: common.yaml]
## counterRate - 反击率 范围[0,1][默认: common.yaml]
## dodgeRate - 闪避率 范围[0,1][默认: common.yaml]
## hitRate - 命中率 范围[0,1][默认: common.yaml]
## critDamageBonusRate - 暴击伤害加成倍数 范围[0,1][默认: common.yaml]
## statusResistRate - 异常状态抗性比率 范围[0,1][默认: common.yaml]
# growth 成长范围: 每个属性包含 min(最小值) 和 max(最大值)

