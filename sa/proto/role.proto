syntax="proto3";

package pb;

option go_package = "saClient/proto";

import "record.proto";
import "pet.proto";

// 角色动作
enum RoleAction {
  RoleAction_Unknow = 0; // 未知动作
  RoleAction_Idle = 1; // 待机
  RoleAction_Stand = 2; // 站立
  RoleAction_Move = 3; // 移动
  RoleAction_Attack = 4; // 攻击
  RoleAction_Hurt = 5; // 受伤
  RoleAction_Die = 6; // 死亡
  RoleAction_Max = 7; // 动作最大值
}

// 角色记录
message RoleRecord {
  uint64 UUID = 1; // 角色UUID 每个用户的角色唯一ID
  string Nick = 2; // 昵称
  map<uint32, uint64> AssetIDRecordMap = 10; // 资产表 key: 资产ID-角色基础 AssetIDRecord value: 数值
  map<uint64, RecordPrimary> RecordMap = 1000; // 记录表 key: 记录-主要ID
  map<uint64, PetRecord> PetRecordMap = 2000; // 宠物记录表 key: 宠物UUID
}