syntax="proto3";

package pb;

option go_package = "saClient/proto";

// 资产-分段 uint32 AssetID 最大值为: 4294,967295
// 采用分段编码方式, 定义不同类型资产ID范围
// A[1,4293] B[0,999999]

// ⚠️ 实际上 enum 出来的是 int32 所以最大值为: 2147,483647
// A[1,2146] B[0,999999]

// 资产类型
enum AssetType {
  AssetType_RoleBase = 0; // 角色基础 [1,1000000]
  
  AssetType_Role = 1; // 角色 [100001,1999999]
  AssetType_Map = 2; // 地图 [200001,2999999]
  AssetType_Item = 3; // 物品 [300001,3999999]
  AssetType_Pet = 4; // 宠物 [400001,4999999]
}

// 资产ID-角色基础
enum AssetIDRoleBase {
  AssetIDRoleBase_Unknow = 0; // 角色基础-未知

  AssetIDRoleBase_Exp = 1; // 角色基础-经验值
  AssetIDRoleBase_HP = 2; // 角色基础-生命值
  AssetIDRoleBase_MP = 3; // 角色基础-魔法值
  AssetIDRoleBase_CreateTimestamp = 4; // 角色基础-创建时间戳
  AssetIDRoleBase_LastLoginTimestamp = 5; // 角色基础-上次登录时间戳
  AssetIDRoleBase_LastLogoutTimestamp = 6; // 角色基础-上次登出时间戳

  AssetIDRoleBase_ElementalEarth = 101; // 角色基础-元素属性-土
  AssetIDRoleBase_ElementalWater = 102; // 角色基础-元素属性-水
  AssetIDRoleBase_ElementalFire = 103; // 角色基础-元素属性-火
  AssetIDRoleBase_ElementalWind = 104; // 角色基础-元素属性-风

  AssetIDRoleBase_BasicAttack = 201; // 角色基础--攻
  AssetIDRoleBase_BasicDefensePoint = 202; // 角色基础-防
  AssetIDRoleBase_BasicAgility = 203; // 角色基础-敏
  AssetIDRoleBase_BasicHP = 204; // 角色基础-生命

}


